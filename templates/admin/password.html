{% extends "admin/base.html" %}
{% from "_icons.html" import icon %}
{% block admin %}
<div class="page-head"><a class="back-link" href="{{ url_for('admin_dashboard') }}">{{ icon('back', 16) }} Dashboard</a><h1>Change password</h1></div>
<form class="form glass narrow-form" method="post" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field"><span>Current password</span><input class="input" type="password" name="current" autocomplete="current-password" required></label>
  <label class="field"><span>New password</span><input class="input" type="password" name="new" minlength="8" autocomplete="new-password" required><small>At least 8 characters.</small></label>
  <label class="field"><span>Repeat new password</span><input class="input" type="password" name="confirm" minlength="8" autocomplete="new-password" required></label>
  <div class="form-actions"><button class="btn btn-primary" type="submit">{{ icon('check', 18) }} Update password</button></div>
</form>
{% endblock %}
