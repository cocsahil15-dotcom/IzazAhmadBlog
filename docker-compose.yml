services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cousin_site
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cousin_site"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/cousin_site
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the .env file}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TZ_NAME: ${TZ_NAME:-Asia/Dhaka}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  backups:
